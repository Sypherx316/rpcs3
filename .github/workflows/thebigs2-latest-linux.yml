# One button: builds RPCS3 for Linux (x64 clang AppImage, the one Batocera uses) from the newest
# official build, with the The Bigs 2 fix (RPCS3 #17741, digant73's 5cdab28) and without the
# "Experimental Build Warning" dialog. The Linux job mirrors upstream's own Linux_Build job, and
# its Docker image and build script are read from that RPCS3 revision's rpcs3.yml.
name: The Bigs 2 fix on the newest RPCS3 (Linux)

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      rpcs3_ref:
        description: RPCS3 commit to build (empty = the newest official build)
        default: ""
        required: false

permissions:
  contents: read

jobs:
  resolve:
    name: Find the newest RPCS3 build
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.find.outputs.sha }}
      version: ${{ steps.find.outputs.version }}
      docker_img: ${{ steps.find.outputs.docker_img }}
      build_sh: ${{ steps.find.outputs.build_sh }}
    steps:
      - id: find
        env:
          REF: ${{ inputs.rpcs3_ref }}
        run: |
          if [[ -n $REF ]]; then
            sha=$REF
            version="custom-${REF:0:8}"
          else
            # The same endpoint RPCS3's updater asks; c is any known commit
            json=$(curl -fsSL --retry 3 "https://update.rpcs3.net/?api=v3&os_type=linux&os_arch=x64&c=55a3aff3")
            version=$(jq -r .latest_build.version <<< "$json")
            sha=$(jq -r .latest_build.linux.download <<< "$json" | grep -oE 'build-[0-9a-f]{40}' | cut -d- -f2)
          fi
          [[ $sha =~ ^[0-9a-f]{7,40}$ ]] || { echo "could not find the RPCS3 commit"; exit 1; }
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/RPCS3/rpcs3/$sha/.github/workflows/rpcs3.yml" -o rpcs3.yml
          job='.jobs.Linux_Build.strategy.matrix.include[] | select(.os == "ubuntu-24.04" and .compiler == "clang")'
          docker_img=$(yq "$job | .docker_img" rpcs3.yml)
          build_sh=$(yq "$job | .build_sh" rpcs3.yml)
          [[ -n $docker_img && $docker_img != null ]] || { echo "could not find upstream's Linux build image"; exit 1; }
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "docker_img=$docker_img"
            echo "build_sh=$build_sh"
          } >> "$GITHUB_OUTPUT"
          echo "RPCS3 $version ($sha), $docker_img"

  build:
    name: RPCS3 ${{ needs.resolve.outputs.version }} + The Bigs 2 fix (Linux)
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      BUILD_REPOSITORY_NAME: ${{ github.repository }}
      BUILD_SOURCEBRANCHNAME: thebigs2-fix
      BUILD_SOURCEVERSION: ${{ needs.resolve.outputs.sha }}
      BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/artifacts/
      CCACHE_DIR: ${{ github.workspace }}/ccache
      DEPLOY_APPIMAGE: true
      APPDIR: /rpcs3/build/appdir
      ARTDIR: /root/artifacts
      RELEASE_MESSAGE: /rpcs3/GitHubReleaseMessage.txt
      COMPILER: clang
      RUN_UNIT_TESTS: "OFF"
    steps:
      - name: Checkout RPCS3 ${{ needs.resolve.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: RPCS3/rpcs3
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Checkout the fix script
        uses: actions/checkout@v4
        with:
          path: _thebigs2
          sparse-checkout: .github/thebigs2

      - name: Apply the The Bigs 2 fix and drop the experimental build dialog
        run: |
          python3 _thebigs2/.github/thebigs2/fix_thebigs2.py rpcs3/Emu/RSX/RSXThread.cpp
          python3 - rpcs3/rpcs3qt/gui_application.cpp <<'EOF'
          import sys
          path = sys.argv[1]
          old = "if (!rpcs3::is_release_build() && !rpcs3::is_local_build())"
          text = open(path, encoding="utf-8", newline="").read()
          if text.count(old) == 1:
              open(path, "w", encoding="utf-8", newline="").write(text.replace(old, "if (false) // No experimental build dialog (thebigs2-fix)"))
              print("experimental build dialog removed")
          else:
              print("::warning::experimental build dialog check not found, the dialog may still show")
          EOF
          git diff --stat
          rm -rf _thebigs2

      - name: Restore build Ccache
        uses: actions/cache/restore@v4
        id: restore-build-ccache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: Linux-ccache-thebigs2-clang-${{ github.run_id }}
          restore-keys: Linux-ccache-thebigs2-clang-

      - name: Docker setup and build
        run: |
          mkdir -p "$CCACHE_DIR" "$BUILD_ARTIFACTSTAGINGDIRECTORY"
          docker pull --quiet ${{ needs.resolve.outputs.docker_img }}
          docker run \
            -v $PWD:/rpcs3 \
            --env-file .ci/docker.env \
            -v $CCACHE_DIR:/root/.ccache \
            -v $BUILD_ARTIFACTSTAGINGDIRECTORY:$ARTDIR \
            ${{ needs.resolve.outputs.docker_img }} \
            ${{ needs.resolve.outputs.build_sh }}

      - name: Upload RPCS3 ${{ needs.resolve.outputs.version }} with the fix
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3-${{ needs.resolve.outputs.version }}-thebigs2-fix-Linux
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}/*.AppImage
          compression-level: 0
          if-no-files-found: error

      - name: Save build Ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-build-ccache.outputs.cache-primary-key }}
