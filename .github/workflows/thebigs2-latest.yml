# One button: builds RPCS3 for Windows from the newest official build, with the The Bigs 2 crowd fix
# (RPCS3 #17741, digant73's 5cdab28). The Windows job mirrors upstream's own Windows_Build job, and
# its settings (Qt, LLVM, Vulkan SDK versions, runner) are read from that RPCS3 revision's rpcs3.yml.
name: The Bigs 2 fix on the newest RPCS3 (Windows)

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      rpcs3_ref:
        description: RPCS3 commit to build (empty = the newest official build)
        default: ""
        required: false

permissions:
  contents: read

jobs:
  resolve:
    name: Find the newest RPCS3 build
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.find.outputs.sha }}
      version: ${{ steps.find.outputs.version }}
      runner: ${{ steps.find.outputs.runner }}
      winenv: ${{ steps.find.outputs.winenv }}
    steps:
      - id: find
        env:
          REF: ${{ inputs.rpcs3_ref }}
        run: |
          if [[ -n $REF ]]; then
            sha=$REF
            version="custom-${REF:0:8}"
          else
            # The same endpoint RPCS3's updater asks; c is any known commit
            json=$(curl -fsSL --retry 3 "https://update.rpcs3.net/?api=v3&os_type=windows&os_arch=x64&c=55a3aff3")
            version=$(jq -r .latest_build.version <<< "$json")
            sha=$(jq -r .latest_build.windows.download <<< "$json" | grep -oE 'build-[0-9a-f]{40}' | cut -d- -f2)
          fi
          [[ $sha =~ ^[0-9a-f]{7,40}$ ]] || { echo "could not find the RPCS3 commit"; exit 1; }
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/RPCS3/rpcs3/$sha/.github/workflows/rpcs3.yml" -o rpcs3.yml
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "runner=$(yq '.jobs.Windows_Build.runs-on' rpcs3.yml)"
            echo "winenv=$(yq -o=json -I=0 '.jobs.Windows_Build.env' rpcs3.yml)"
          } >> "$GITHUB_OUTPUT"
          echo "RPCS3 $version ($sha)"

  build:
    name: RPCS3 ${{ needs.resolve.outputs.version }} + The Bigs 2 fix (Windows)
    needs: resolve
    runs-on: ${{ needs.resolve.outputs.runner }}
    timeout-minutes: 300
    env:
      BUILD_REPOSITORY_NAME: ${{ github.repository }}
      BUILD_SOURCEBRANCHNAME: thebigs2-fix
      BUILD_SOURCEVERSION: ${{ needs.resolve.outputs.sha }}
      BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/artifacts/
    steps:
      - name: Checkout RPCS3 ${{ needs.resolve.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: RPCS3/rpcs3
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Checkout the fix script
        uses: actions/checkout@v4
        with:
          path: _thebigs2
          sparse-checkout: .github/thebigs2

      - name: Apply the The Bigs 2 fix
        run: |
          python _thebigs2/.github/thebigs2/fix_thebigs2.py rpcs3/Emu/RSX/RSXThread.cpp
          git diff --stat
          rm -rf _thebigs2

      - name: Use upstream's Windows build settings
        shell: pwsh
        env:
          WINENV: ${{ needs.resolve.outputs.winenv }}
        run: |
          $settings = $env:WINENV | ConvertFrom-Json
          foreach ($p in $settings.PSObject.Properties) { "$($p.Name)=$($p.Value)" >> $env:GITHUB_ENV }

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore rpcs3.sln

      - name: Setup env
        shell: pwsh
        run: |
          echo "QTDIR=C:\Qt\${{ env.QT_VER }}\${{ env.QT_VER_MSVC }}_64" >> $env:GITHUB_ENV
          echo "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_VER }}" >> $env:GITHUB_ENV

      - name: Get Cache Keys
        run: .ci/get_keys-windows.sh

      - name: Download and unpack dependencies
        run: |
          .ci/setup-windows.sh
          .ci/setup-windows-ci-vars.sh win64 msvc

      - name: Export Variables
        run: |
          while IFS='=' read -r key val; do
            [[ -z "$key" || "$key" =~ ^# ]] && continue
            echo "$key=$val" >> "$GITHUB_ENV"
          done < .ci/ci-vars.env

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Compile RPCS3
        shell: pwsh
        run: msbuild rpcs3.sln /p:Configuration=Release /v:minimal /p:Platform=x64 /p:PreferredToolArchitecture=x64 /p:CLToolPath=${{ env.CCACHE_BIN_DIR }} /p:UseMultiToolTask=true /p:CustomAfterMicrosoftCommonTargets="${{ github.workspace }}\buildfiles\msvc\ci_only.targets"

      - name: Pack up build artifacts
        run: |
          mkdir -p "$BUILD_ARTIFACTSTAGINGDIRECTORY"
          .ci/deploy-windows.sh

      - name: Upload RPCS3 ${{ needs.resolve.outputs.version }} with the fix
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3-${{ needs.resolve.outputs.version }}-thebigs2-fix-Windows
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}
          compression-level: 0
          if-no-files-found: error
